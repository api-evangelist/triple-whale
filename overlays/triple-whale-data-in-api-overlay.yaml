      mechanism: natural-key-upsert
      key_header: null
      order_natural_key:
      - shop
      - order_id
      - refund_id
      - created_at
      - refunded_at
      - platform
      - platform_account_id
      note: Resending a record with identical key fields overwrites all other fields; retries are safe.
