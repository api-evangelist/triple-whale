    x-apievangelist-notes:
    - Every REST operation is secured by the x-api-key header; key scopes are selected per key in the
      Triple Whale app.
    - A shop identifier is required on every request, but the field name varies by endpoint (shopId /
      shop / shopDomain).
    - Errors are plain application/json, not RFC 9457 problem+json.
    - 429 responses carry Retry-After; some operations also return RateLimit-Policy and RateLimit.
    - No deprecation policy or Sunset header support is published.
- target: $
  update:
