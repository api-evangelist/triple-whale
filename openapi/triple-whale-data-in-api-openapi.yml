                  example: San Francisco
                country:
                  type: string
                  description: The country of the customer's default address.
                  example: United States
                country_code:
                  type: string
                  description: The country code of the customer’s default address, according to ISO 3166-1 alpha-2.
                  example: US
                created_at:
                  type: string
                  format: date-time
                  description: 'The time at which the customer record was created. Must be provided in ISO 8601 format, with explicit timezone information (`Z` or `+/-HH:mm` offset). Offsets are supported (e.g., `2024-11-29T12:00:00+02:00`). Defaults to the current time.

                    '
                  example: '2022-06-15T19:26:30.000Z'
                customer_tags:
                  type: array
