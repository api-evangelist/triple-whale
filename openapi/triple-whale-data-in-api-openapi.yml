                    '
                  example: madisonbraids.myshopify.com
                customer_id:
                  type: string
                  description: The unique identifier for the customer.
                  example: '5209503793328'
                platform:
                  type: string
                  description: 'The platform associated with the customer record (e.g. `shopify`, `magento`, `woocommerce`, `klaviyo`).

                    '
                  default: custom-msp
                  example: magento
                platform_account_id:
                  type: string
                  description: 'The account ID associated with the platform.

                    '
                  default: custom-msp
                  example: shop_account_123
                address1:
                  type: string
