  /data-in/pps:
    post:
      summary: Create Post-Purchase Survey (PPS) Record
      description: 'Ingest PPS data into Triple Whale. This endpoint allows users to upload  detailed post-purchase survey information, including order-related data, questions, and responses.

        '
      operationId: create-pps-record
      tags:
      - Data In
      security:
      - apiKeyAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - shop
              - order_id
              properties:
                shop:
                  type: string
                  description: 'The exact Shop URL (e.g., ''example.myshopify.com''). Must match the Shop URL value shown in  [Settings → Store](https://app.triplewhale.com/store-settings/general). The API key owner must  also have access to the shop, otherwise the request will return 403.

                    '
                  example: madisonbraids.myshopify.com
                platform:
                  type: string
                  description: 'The platform where the post-purchase survey originated.

                    '
                  default: custom_pps_platform
                  example: custom_pps_platform
                platform_account_id:
                  type: string
                  description: 'The account ID associated with the platform.

                    '
                  default: custom_platform_account
                  example: platform_account_123
                order_id:
                  type: string
                  description: The unique identifier for the order associated with the PPS.
                  example: order-123
                created_at:
                  type: string
                  format: date-time
                  description: 'The time at which the post-purchase survey record was created. Must be provided in ISO 8601 format, with explicit timezone information (`Z` or `+/-HH:mm` offset). Offsets are supported (e.g., `2024-11-29T12:00:00+02:00`). Defaults to the current time.

                    '
                  example: '2022-06-15T19:26:30.000Z'
                total_price:
                  type: number
                  description: The total price of the order associated with the PPS. Must be non-negative.
                  example: 150.75
                question_id:
                  type: string
                  description: Unique ID for the survey question. If omitted, the data will still be used for attribution (when `include_in_attribution = true`), but won’t appear in the PPS table, SQL, or Moby.
                  example: question-001
                question_text:
                  type: string
                  description: The text of the survey question. Maps to `question` in the Post-Purchase Survey table.
                  example: How did you hear about us?
                response_id:
                  type: string
                  description: Unique ID for the survey response.
                  example: response-001
                response:
                  type: string
                  description: The customer’s response to the survey question. Maps to `answer` in the Post-Purchase Survey table.
                  example: Recommended by a friend
                include_in_attribution:
                  type: boolean
                  description: 'Set to `true` to include this survey response in the [Total Impact and Triple Attribution models](https://kb.triplewhale.com/en/articles/5960333-understanding-and-utilizing-attribution-models#h_2edf480eb9).  If omitted, Triple Whale will determine whether the question is attribution-related based on the `question_text`.

                    '
                  example: true
                source:
                  type: string
                  description: 'The marketing or referral channel that appears in [Attribution](https://app.triplewhale.com/dashboards/attribution/all/). If omitted, Triple Whale infers the source from the `response` text. You may provide any string value, but using a [Standardized PPS Source ID](https://triplewhale.readme.io/docs/post-purchase-survey-pps-standardized-source-ids#/) (e.g. `facebook-ads`) ensures offline events are grouped with existing channels rather than appearing as a separate custom source.

                    '
                  example: facebook-ads
      responses:
        '200':
          description: PPS record successfully received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: pps received
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid PPS data.
        '404':
          description: Order Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Order not found
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: The number of seconds until the user can make another request.
              schema:
                type: string
                example: '60'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Rate limit exceeded. Try again later.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Error processing pps
  /data-in/customers:
    post:
      summary: Create Customer Record
      description: 'Ingest customer data into Triple Whale. This endpoint allows users to upload detailed customer information — including contact details, address, consent status, and purchase history metadata.

        '
