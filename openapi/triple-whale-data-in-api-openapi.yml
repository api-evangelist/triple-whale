  /data-in/event:
    post:
      summary: Enrich Pixel With Offline Events
      description: 'Send offline or server-side Pixel events—such as leads, MQLs, SQLs, opportunities, book-a-demo events, or fully custom events—into Triple Whale.  Rate limit is 1,000 events/min. Max payload is 3 KB. When `type = custom`, you can add additional properties of type **Number, Float, String, Boolean, or Date**.

        '
      operationId: enrich-pixel-with-offline-events
      tags:
      - Data In
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - shop
              - type
              - profileIdentifiers
              properties:
                shop:
                  type: string
                  description: 'The exact Shop URL (e.g., ''example.myshopify.com''). Must match the Shop URL value shown in  [Settings → Store](https://app.triplewhale.com/store-settings/general). The API key owner must  also have access to the shop, otherwise the request will return 403.

                    '
                  example: madisonbraids.myshopify.com
                type:
                  type: string
                  description: 'The event category. Can be a standard lifecycle event (`lead`, `mql`, `sql`, `opportunity`, `book_demo`) or a Custom event (`custom`).

                    '
                  enum:
                  - lead
                  - mql
                  - sql
                  - opportunity
                  - book_demo
                  - custom
                  example: custom
                profileIdentifiers:
                  type: object
                  description: 'At least one identifier is required.   Use these to match the event to an existing or future profile.

                    '
                  properties:
                    email:
                      type: string
                      format: email
                      example: john.smith@gmail.com
                    phone:
                      type: string
                      example: +1-555-123-4567
                    externalId:
                      type: string
                      example: user_123
                eventId:
                  type: string
                  description: 'Optional unique identifier for the event to prevent duplicates.

                    '
                  example: event_456
                timestamp:
                  type: number
                  format: int64
                  description: 'Optional UNIX timestamp in **seconds** for when the event occurred.   Defaults to the current server time if omitted.

                    '
                  example: 1732579200
                event_name:
                  type: string
                  description: 'Required only when **type** = `custom`.   A descriptive name for the custom event.

                    '
                  example: productCustomizationInteraction
                source:
                  type: string
                  description: 'Optional attribution source for custom events. To have events grouped into existing paid channels in [Attribution](https://app.triplewhale.com/dashboards/attribution/all/), use a [standardized source ID](https://triplewhale.readme.io/docs/post-purchase-survey-pps-standardized-source-ids) (e.g. `facebook-ads`). Custom values will appear as separate custom sources.

                    '
                  example: facebook-ads
                campaign:
                  type: string
                  description: 'Optional attribution campaign for custom events.

                    '
                  example: Winter_Sale_2025
                ad:
                  type: string
                  description: 'Optional attribution ad name for custom events.

                    '
                  example: Winter_Sale_2025_Ad_1
                adset:
                  type: string
                  description: 'Optional attribution ad set name for custom events.

                    '
                  example: Winter_Sale_2025_Adset_A
              additionalProperties:
                type: object
                oneOf:
                - type: number
                - type: string
                - type: boolean
                description: 'Extra properties allowed **only** when `type = custom`.   Each value must be a **Number (Integer or Float), String (Plain String or Date), or Boolean**.

                  '
            examples:
              LeadEvent:
                value:
                  shop: madisonbraids.myshopify.com
                  type: lead
                  profileIdentifiers:
                    email: john.smith@gmail.com
              CustomEvent:
                value:
                  shop: madisonbraids.myshopify.com
                  type: custom
                  timestamp: 1732579200
                  profileIdentifiers:
                    email: abcdef@gmail.com
                  event_name: my_test_event
                  value: 10
      responses:
        '200':
          description: Pixel event successfully received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Pixel event received
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid pixel event data.
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Payload too large
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: 'Seconds until another request can be made.

                '
              schema:
                type: string
              example: '60'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Rate limit exceeded. Try again later.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Error processing pixel event
