                  description: The level of consent provided by the customer for SMS marketing.
                  example: CONFIRMED_OPT_IN
                sms_marketing_consent_updated_at:
                  type: string
                  format: date-time
                  description: 'The time at which the sms marketing consent was updated. Must be provided in ISO 8601 format, with explicit timezone information (`Z` or `+/-HH:mm` offset). Offsets are supported (e.g., `2024-11-29T12:00:00+02:00`).

                    '
                  example: '2019-05-22 21:01:29'
                state:
                  type: string
                  description: The state or province of the customer's default address.
