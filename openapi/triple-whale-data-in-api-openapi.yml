                  - Login with FB
                display_name:
                  type: string
                  description: The display name of the customer.
                  example: John Doe
                email_address:
                  type: string
                  description: The primary email address associated with the customer’s account.
                  example: customer@example.com
                email_marketing_consent_collected_from:
                  type: string
                  description: The source from which the customer's email marketing consent was collected.
                  example: website_signup
                email_marketing_consent_opt_in_level:
                  type: string
                  description: The level of consent provided by the customer for email marketing.
                  example: SINGLE_OPT_IN
                email_marketing_consent_status:
                  type: string
                  description: The current status of the customer's email marketing consent.
                  example: SUBSCRIBED
                email_marketing_consent_updated_at:
                  type: string
                  format: date-time
                  description: 'The time at which the email marketing consent was updated. Must be provided in ISO 8601 format, with explicit timezone information (`Z` or `+/-HH:mm` offset). Offsets are supported (e.g., `2024-11-29T12:00:00+02:00`).

                    '
                  example: '2019-05-22 21:01:29'
                first_name:
                  type: string
                  description: The customer's first name.
                  example: John
                last_name:
                  type: string
                  description: The customer's last name.
