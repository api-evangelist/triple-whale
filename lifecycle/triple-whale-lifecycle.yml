  base: https://api.triplewhale.com/api/v2/
  docs: https://triplewhale.readme.io/reference/introduction-to-the-triple-whale-api
  note: >-
    No dated versions, no version request header, and no published policy for how
    long a major version is supported. Some operations carry an unversioned suffix
    of their own (get-orders-with-journeys-v2), which is endpoint-level revisioning
    inside /api/v2 rather than API versioning.

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    No deprecation policy, no RFC 8594 Sunset/Deprecation header support, and no
    advance-notice commitment could be found. The only acknowledgement of removal
    is in the error guide, which lists "endpoint has been renamed or removed" as a
    cause of 404 — after the fact, not before it. This is a real gap: an integrator
    has no published signal that an endpoint is going away.

