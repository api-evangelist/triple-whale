  version: 0.1.4
  published: '2026-06-04'
  description: Triple Pixel iOS SDK distributed as a Swift package (statically linked XCFramework)
  docs: https://triplewhale.readme.io/reference/mobile-sdk-installation
  note: >-
    SPM has no central metadata endpoint; version and date read from the GitHub
    release feed for the repository (tag 0.1.4, published 2026-06-04). A manual
    TriplePixelSDK.xcframework.zip is attached to each release for teams that
    cannot use SPM.

