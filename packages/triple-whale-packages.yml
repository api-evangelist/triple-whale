generated: '2026-08-13'
method: searched
source: >-
  registry.npmjs.org, repo1.maven.org, github.com/Triple-Whale releases, and
  https://triplewhale.readme.io/reference/mobile-sdk-installation.md
note: >-
  Triple Whale publishes no server-side REST client library for the Data-In /
  Data-Out APIs in any language — the docs demonstrate raw HTTP plus the code
  samples in github.com/Triple-Whale/triple-whale-public-apis (Node and Python
  examples, not distributed packages). What it does publish is the Triple Pixel
  Mobile SDK across three ecosystems, an MCP server, and a pixel-installation CLI.
  PyPI, RubyGems, crates.io, Packagist and NuGet were checked and carry no
  first-party Triple Whale package.

packages:
- language: javascript
  registry: npm
  name: '@triplewhale/react-native-triple-pixel'
  url: https://www.npmjs.com/package/@triplewhale/react-native-triple-pixel
  install: npm install @triplewhale/react-native-triple-pixel
  official: true
  version: 0.1.4
  published: '2026-06-04'
  description: React Native bridge for the Triple Whale Triple Pixel tracking SDK
  docs: https://triplewhale.readme.io/reference/mobile-sdk-installation
  note: >-
    Bundles pre-built native binaries for Android and iOS; autolinked. Requires
    React Native 0.71+, Node 18+, Android minSdk 24, iOS 14.0.

- language: swift
